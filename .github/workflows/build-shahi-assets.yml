name: Build Shahi piece assets (temporary)

on:
  push:
    branches: [add-shahi-piece-set]
    paths:
      - '.github/workflows/build-shahi-assets.yml'
      - 'scripts/generate_shahi_assets.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-shahi-piece-set
          persist-credentials: true
      - name: Install image converters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape webp
      - name: Generate mobile and iOS images
        run: bash scripts/generate_shahi_assets.sh
      - name: Verify output files
        run: |
          for p in bB bK bN bP bQ bR wB wK wN wP wQ wR; do
            for scale in '' '2.0x/' '3.0x/'; do
              test -s "assets/piece_sets/shahi-ivory-brown/${scale}${p}.webp"
            done
            test -s "swift/Sources/ChessgroundAssets/Assets.xcassets/piece_shahiIvoryBrown_${p}.imageset/Contents.json"
          done
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/piece_sets/shahi-ivory-brown/ swift/Sources/ChessgroundAssets/Assets.xcassets/
          if ! git diff --staged --quiet; then
            git commit -m "Generate Şahî WebP and Swift piece assets [generated shahi]"
            git push origin HEAD:add-shahi-piece-set
          fi
